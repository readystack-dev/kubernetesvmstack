# kube-vip static pod for the ReadyStack Kubernetes VM stack (install order: README.md in the install directory): the
# control-plane VIP in ARP mode with leader election, control plane only (no Service load balancing).
# Generated by the stack's own readystack/kubevip:v1.3.1 image (2026-10-28):
#   kube-vip manifest pod --interface <if> --address <vip> --controlplane --arp --leaderElection --image <image>
# then, by hand:
#   - the interface, address and image replaced by the placeholders below (kube-vip validates them, so it was run
#     with sentinel values); the image is pinned by digest
#   - securityContext.runAsUser: 0. Our image runs as a non-root user by default (root is set by the Pod); kube-vip reads
#     the root-only kubeconfig and needs its NET_ADMIN/NET_RAW, which take effect only for uid 0 (Kubernetes grants no
#     ambient capabilities). Upstream's image runs as root, so this is the pod upstream's manifest gives.
# Do not apply it with kubectl: kube-vip-static-pod.sh writes it to /etc/kubernetes/manifests/kube-vip.yaml with the
# right kubeconfig (super-admin.conf during kubeadm init on the first node, admin.conf otherwise).
# Placeholders:
#   ${LOCAL_REGISTRY}       the local registry host:port the nodes pull from
#   ${DIGEST_kubevip}       sha256:... of readystack/kubevip:v1.3.1-CE-ubuntu24.04-r2
#   ${KUBE_VIP_ADDRESS}     the control-plane VIP (kubeadm controlPlaneEndpoint <VIP>:6443)
#   ${KUBE_VIP_INTERFACE}   the node interface carrying it, the same name on all three control-plane nodes
apiVersion: v1
kind: Pod
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  containers:
  - args:
    - manager
    env:
    - name: vip_arp
      value: "true"
    - name: port
      value: "6443"
    - name: vip_nodename
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: vip_interface
      value: ${KUBE_VIP_INTERFACE}
    - name: vip_subnet
      value: "32"
    - name: dns_mode
      value: first
    - name: dhcp_mode
      value: ipv4
    - name: cp_enable
      value: "true"
    - name: cp_namespace
      value: kube-system
    - name: vip_leaderelection
      value: "true"
    - name: vip_leasename
      value: plndr-cp-lock
    - name: vip_leaseduration
      value: "15"
    - name: vip_renewdeadline
      value: "10"
    - name: vip_retryperiod
      value: "2"
    - name: address
      value: ${KUBE_VIP_ADDRESS}
    - name: prometheus_server
      value: :2112
    image: ${LOCAL_REGISTRY}/readystack/kubevip@${DIGEST_kubevip}
    imagePullPolicy: IfNotPresent
    name: kube-vip
    resources: {}
    securityContext:
      capabilities:
        add:
        - NET_ADMIN
        - NET_RAW
        drop:
        - ALL
      runAsUser: 0
    volumeMounts:
    - mountPath: /etc/kubernetes/admin.conf
      name: kubeconfig
  hostAliases:
  - hostnames:
    - kubernetes
    ip: 127.0.0.1
  hostNetwork: true
  volumes:
  - hostPath:
      path: /etc/kubernetes/admin.conf
    name: kubeconfig
status: {}

